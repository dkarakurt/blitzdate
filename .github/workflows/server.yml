name: Sunucu (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/logic/**'
      - 'src/backend/live.ts'
      - 'src/backend/errors.ts'
      - '.github/workflows/server.yml'
  workflow_dispatch:

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Tip kontrolü ve birim/API testleri
        run: |
          npm run typecheck
          npm test
      - name: Uçtan uca (uygulamanın istemci kodu ↔ yerel sunucu)
        run: |
          npm run e2e:build
          npx wrangler d1 migrations apply fink-db --local
          npx wrangler dev --port 8799 --ip 127.0.0.1 --var DO_JURISDICTION: > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8799/v1/health && break; sleep 1; done
          node e2e/out.mjs http://127.0.0.1:8799 || (cat /tmp/dev.log; exit 1)

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FINK_DOMAIN: ${{ vars.FINK_DOMAIN }}
    steps:
      - name: Cloudflare ayarları var mı?
        id: check
        working-directory: .
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID tanımlı değil; yayınlama atlandı."
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - if: steps.check.outputs.ok == 'true'
        run: npm ci && npm run sync-shared
      - name: Veritabanı (D1) yoksa oluştur, kimliğini ayara yaz
        if: steps.check.outputs.ok == 'true'
        run: |
          id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const db=l.find(x=>x.name==="fink-db");process.stdout.write(db?db.uuid:"")})')
          if [ -z "$id" ]; then
            npx wrangler d1 create fink-db --location weur
            id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{process.stdout.write(JSON.parse(s).find(x=>x.name==="fink-db").uuid)})')
          fi
          echo "D1: $id"
          sed "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc > wrangler.generated.jsonc
          if [ -n "$FINK_DOMAIN" ]; then
            # Kendi alan adı: api.<alan adı> (workers.dev Türkiye'den erişilemiyor)
            sed -i "s|\"workers_dev\": true,|\"workers_dev\": true,\n  \"routes\": [{ \"pattern\": \"api.$FINK_DOMAIN\", \"custom_domain\": true }],|" wrangler.generated.jsonc
            echo "Özel alan adı: api.$FINK_DOMAIN"
          fi
      - name: Veritabanı şemasını güncelle
        if: steps.check.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply fink-db --remote -c wrangler.generated.jsonc
      - name: Yayınla
        if: steps.check.outputs.ok == 'true'
        run: npx wrangler deploy -c wrangler.generated.jsonc
      - name: Sağlık kontrolü
        id: live
        if: steps.check.outputs.ok == 'true'
        run: |
          sub=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).result.subdomain))')
          url="https://fink-api.$sub.workers.dev"
          if [ -n "$FINK_DOMAIN" ]; then url="https://api.$FINK_DOMAIN"; fi
          for i in $(seq 1 20); do curl -sf "$url/v1/health" && break; sleep 6; done
          echo
          echo "::notice::Sunucu yayında: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Canlı duman testi (kayıt → profil → konum → radar → hesap silme)
        if: steps.check.outputs.ok == 'true'
        run: |
          url="${{ steps.live.outputs.url }}"
          t() { /usr/bin/time -f "  %es" "$@"; }
          echo "kayıt:"; reg=$(t curl -sS -m 25 -X POST "$url/v1/register" -H 'Content-Type: application/json' -d '{"gender":"female","adultConfirmed":true,"termsVersion":"2026-11-11"}'); echo "$reg" | sed 's/"token":"[^"]*"/"token":"***"/' 
          tok=$(echo "$reg" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).token||""))')
          [ -n "$tok" ] || { echo "::error::Kayıt başarısız"; exit 1; }
          echo "profil:"; t curl -sS -m 25 "$url/v1/me" -H "Authorization: Bearer $tok"; echo
          echo "konum:"; t curl -sS -m 25 -X POST "$url/v1/presence" -H "Authorization: Bearer $tok" -H 'Content-Type: application/json' -d '{"lat":41.0,"lng":29.0}'; echo
          echo "radar:"; t curl -sS -m 25 "$url/v1/nearby" -H "Authorization: Bearer $tok"; echo
          echo "silme:"; t curl -sS -m 25 -X DELETE "$url/v1/me" -H "Authorization: Bearer $tok"; echo
          echo "::notice::Canlı duman testi geçti"
