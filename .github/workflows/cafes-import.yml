name: Kafe verisini güncelle

# OpenStreetMap Türkiye verisinden kafeleri alır ve sunucunun veritabanına (D1) yükler.
# Ayda bir kendiliğinden çalışır; elle de çalıştırılabilir.
on:
  schedule:
    - cron: '17 2 3 * *'
  workflow_dispatch:

concurrency:
  group: cafes-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Araçlar
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: OpenStreetMap Türkiye verisini indir (Geofabrik)
        run: |
          curl -sSfL --retry 3 -o /tmp/turkey.osm.pbf https://download.geofabrik.de/europe/turkey-latest.osm.pbf
          ls -lh /tmp/turkey.osm.pbf
      - name: Kafeleri ayıkla
        run: |
          osmium tags-filter /tmp/turkey.osm.pbf nwr/amenity=cafe -o /tmp/cafes.osm.pbf --overwrite
          osmium export /tmp/cafes.osm.pbf -f geojsonseq -x print_record_separator=false --add-unique-id=type_id -o /tmp/cafes.geojsonseq --overwrite
          node scripts/cafes-to-sql.mjs /tmp/cafes.geojsonseq /tmp/cafes.sql
          ls -lh /tmp/cafes.sql
      - name: Veritabanına yükle
        run: |
          id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(x=>x.name==="fink-db");process.stdout.write(db?db.uuid:"")})')
          [ -n "$id" ] || { echo "::error::fink-db bulunamadı"; exit 1; }
          sed "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc > wrangler.generated.jsonc
          npx wrangler d1 migrations apply fink-db --remote -c wrangler.generated.jsonc
          npx wrangler d1 execute fink-db --remote -c wrangler.generated.jsonc --file /tmp/cafes.sql --yes
          n=$(npx wrangler d1 execute fink-db --remote -c wrangler.generated.jsonc --json --command "SELECT COUNT(*) AS n FROM cafes" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s)[0].results[0].n)))')
          echo "::notice::Veritabanında $n kafe var"
