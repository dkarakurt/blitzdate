name: AAB'yi geçici dala koy
on:
  push:
    branches: [play-upload]
    paths: ['.github/workflows/aab.yml']
permissions:
  contents: write
  actions: read
jobs:
  koy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fink-aab
          run-id: 44815759189
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: aab
      - run: |
          ls -la aab
          f=$(ls aab/*.aab | head -1)
          cp "$f" fink.aab
          unzip -l fink.aab | tail -1
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add fink.aab
          git commit -m "Play yüklemesi için geçici AAB (run 44815759189)"
          git push
