name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'server/**'
      - 'web/**'
      - '.scrollcraft.json'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/server.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Testler, tip kontrolü ve lint
        run: |
          npm test -- --ci
          npm run typecheck
          npx expo lint

      - name: Android projesini üret (prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Sunucu adresini bul
        env:
          API_URL: ${{ vars.FINK_API_URL || 'https://fink.dilakarakurt.com' }}
        run: |
          # workers.dev Türkiye'den erişilemediği için uygulama özel alan adına bağlanır.
          echo "EXPO_PUBLIC_API_URL=${API_URL%/}" >> "$GITHUB_ENV"
          echo "::notice::Canlı sürüm derleniyor → ${API_URL%/}"

      - name: Yükleme anahtarı (Google Play)
        env:
          KEYSTORE_B64: ${{ secrets.FINK_UPLOAD_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.FINK_UPLOAD_PASSWORD }}
        run: |
          # Play her yüklemede daha büyük bir sürüm kodu ister
          echo "FINK_VERSION_CODE=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fink-upload.p12"
            {
              echo "FINK_UPLOAD_STORE_FILE=$RUNNER_TEMP/fink-upload.p12"
              echo "FINK_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "FINK_UPLOAD_KEY_PASSWORD=$KEYSTORE_PASSWORD"
              echo "FINK_UPLOAD_KEY_ALIAS=fink-upload"
            } >> "$GITHUB_ENV"
            echo "::notice::Yükleme anahtarıyla imzalanıyor; sürüm kodu $(( ${{ github.run_number }} + 100 ))"
          else
            echo "::warning::FINK_UPLOAD_KEYSTORE / FINK_UPLOAD_PASSWORD yok: hata ayıklama anahtarıyla imzalanıyor, AAB Google Play'e yüklenemez"
          fi

      - name: APK ve AAB derle
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: İmzayı doğrula
        run: |
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -E "Owner|SHA256:" | head -3

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: fink-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: AAB'yi yükle (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: fink-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
