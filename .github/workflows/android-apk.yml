name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'server/**'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/server.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Testler, tip kontrolü ve lint
        run: |
          npm test -- --ci
          npm run typecheck
          npx expo lint

      - name: Android projesini üret (prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Sunucu adresini bul
        env:
          # Cloudflare ayarları tanımlıysa uygulama canlı sunucuya bağlanır; yoksa demo modunda derlenir.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_URL_OVERRIDE: ${{ vars.FINK_API_URL }}
        run: |
          url="$API_URL_OVERRIDE"
          if [ -z "$url" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            sub=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).result.subdomain||"")}catch{}})')
            [ -n "$sub" ] && url="https://fink-api.$sub.workers.dev"
          fi
          if [ -n "$url" ]; then
            echo "EXPO_PUBLIC_API_URL=$url" >> "$GITHUB_ENV"
            echo "::notice::Canlı sürüm derleniyor → $url"
          else
            echo "::notice::Sunucu ayarı yok → DEMO sürüm derleniyor"
          fi

      - name: APK derle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: fink-apk
          path: android/app/build/outputs/apk/release/app-release.apk
