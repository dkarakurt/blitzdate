name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'functions/**'
      - 'rules-tests/**'
      - 'firestore.*'
      - '*.md'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Testler, tip kontrolü ve lint
        run: |
          npm test -- --ci
          npm run typecheck
          npx expo lint

      - name: Android projesini üret (prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: APK derle
        working-directory: android
        env:
          # Tanımlıysa uygulama canlı Firebase sunucusuna bağlanır; yoksa demo modunda derlenir.
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        run: ./gradlew assembleRelease --no-daemon

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: blitzdate-apk
          path: android/app/build/outputs/apk/release/app-release.apk
