name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'server/**'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/server.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Testler, tip kontrolü ve lint
        run: |
          npm test -- --ci
          npm run typecheck
          npx expo lint

      - name: Android projesini üret (prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Sunucu adresini bul
        env:
          API_URL: ${{ vars.FINK_API_URL || 'https://fink.dilakarakurt.com' }}
        run: |
          # workers.dev Türkiye'den erişilemediği için uygulama özel alan adına bağlanır.
          echo "EXPO_PUBLIC_API_URL=${API_URL%/}" >> "$GITHUB_ENV"
          echo "::notice::Canlı sürüm derleniyor → ${API_URL%/}"

      - name: APK derle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: fink-apk
          path: android/app/build/outputs/apk/release/app-release.apk
