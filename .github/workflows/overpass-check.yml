name: Harita servisi kontrolü

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Overpass sunucularını ölç (Kadıköy, 700 m)
        run: |
          q='[out:json][timeout:10];(node["amenity"="cafe"](around:700,40.9903,29.029);way["amenity"="cafe"](around:700,40.9903,29.029););out center 40;'
          for u in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.osm.ch/api/interpreter; do
            for method in POST GET; do
              if [ $method = POST ]; then
                out=$(curl -s -m 25 -o /tmp/o.json -w "%{http_code} %{time_total}s" -A "Fink/0.3 (+https://fink.dilakarakurt.com)" --data-urlencode "data=$q" "$u")
              else
                out=$(curl -s -m 25 -o /tmp/o.json -w "%{http_code} %{time_total}s" -A "Fink/0.3 (+https://fink.dilakarakurt.com)" -G --data-urlencode "data=$q" "$u")
              fi
              n=$(node -e 'try{const j=require("/tmp/o.json");console.log((j.elements||[]).length+" kafe")}catch{console.log("json değil: "+require("fs").readFileSync("/tmp/o.json","utf8").slice(0,80).replace(/\s+/g," "))}' 2>/dev/null)
              echo "$u $method → $out  $n"
            done
          done
