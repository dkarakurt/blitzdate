name: Canlı uçtan uca test

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: İki test kullanıcısıyla canlı sunucuda tam akış (sonunda hesaplar silinir)
        run: |
          npm run e2e:build
          node e2e/out.mjs "${{ vars.FINK_API_URL || 'https://fink.dilakarakurt.com' }}"
