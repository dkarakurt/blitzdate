name: Sunucu (Firebase)

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - 'rules-tests/**'
      - 'src/logic/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Fonksiyon testleri
        working-directory: functions
        run: |
          npm ci
          npm test

      - name: Güvenlik kuralları testleri (Firestore emülatörü)
        run: |
          npm --prefix rules-tests ci
          npx --prefix rules-tests firebase emulators:exec --only firestore --project demo-fink "npm --prefix rules-tests test"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - name: Kimlik bilgisi yoksa atla
        if: env.HAS_SA != 'true'
        run: echo "FIREBASE_SERVICE_ACCOUNT gizli değişkeni tanımlı değil; dağıtım atlandı."

      - uses: actions/checkout@v4
        if: env.HAS_SA == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_SA == 'true'
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        if: env.HAS_SA == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Firestore kuralları, indeksler ve Cloud Functions'ı dağıt
        if: env.HAS_SA == 'true'
        run: |
          npm --prefix functions ci
          npm --prefix rules-tests ci
          npx --prefix rules-tests firebase deploy --only firestore,functions --project "$PROJECT_ID" --non-interactive --force
